<svg viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated F1 car flying past at speed">
<title>Fly-by — full speed</title>
<defs>
  <style><![CDATA[
    .tarmac{ fill:#111114; }
    .body-fill{ fill:#e8220a; }
    .dark{ fill:#0a0a0a; }
    .carbon{ fill:#111111; }
    .rim{ fill:#1c1c1c; stroke:#444; stroke-width:1.5; }
    .tyre{ fill:#111111; stroke:#2a2a2a; stroke-width:2; }
    .accent{ stroke:#f5c400; stroke-width:2; fill:none; }
    text{ font-family: 'DM Mono', 'Courier New', monospace; }

    #carWrap{ animation: drive 2.6s linear infinite; }
    @keyframes drive{
      0%   { transform: translateX(-180px); }
      100% { transform: translateX(780px); }
    }
    #wheelSpin{ animation: spin 0.22s linear infinite; }
    @keyframes spin{ to{ transform: rotate(360deg); } }

    .kerb{ animation: kerbMove 0.5s linear infinite; }
    @keyframes kerbMove{ 0%{ transform: translateX(0);} 100%{ transform: translateX(-40px);} }

    .streak{ animation: streakMove 2.6s linear infinite; }
    @keyframes streakMove{
      0%   { transform: translateX(-260px); opacity:0; }
      6%   { opacity:0.6; }
      40%  { opacity:0.6; }
      48%  { opacity:0; transform: translateX(340px); }
      100% { opacity:0; transform: translateX(340px); }
    }
  ]]></style>
</defs>

<rect width="600" height="160" fill="#080808"/>
<rect class="tarmac" x="0" y="128" width="600" height="32"/>
<line x1="0" y1="128" x2="600" y2="128" stroke="#2a2a2a" stroke-width="1"/>

<g class="kerb">
  <g fill="#e8220a">
    <rect x="-40" y="150" width="20" height="6"/><rect x="0" y="150" width="20" height="6"/>
    <rect x="40" y="150" width="20" height="6"/><rect x="80" y="150" width="20" height="6"/>
    <rect x="120" y="150" width="20" height="6"/><rect x="160" y="150" width="20" height="6"/>
    <rect x="200" y="150" width="20" height="6"/><rect x="240" y="150" width="20" height="6"/>
    <rect x="280" y="150" width="20" height="6"/><rect x="320" y="150" width="20" height="6"/>
    <rect x="360" y="150" width="20" height="6"/><rect x="400" y="150" width="20" height="6"/>
    <rect x="440" y="150" width="20" height="6"/><rect x="480" y="150" width="20" height="6"/>
    <rect x="520" y="150" width="20" height="6"/><rect x="560" y="150" width="20" height="6"/>
    <rect x="600" y="150" width="20" height="6"/><rect x="640" y="150" width="20" height="6"/>
  </g>
</g>

<g class="streak" style="animation-delay:0s">
  <rect x="0" y="118" width="70" height="3" fill="#e8e8e2" opacity="0.5"/>
</g>
<g class="streak" style="animation-delay:-0.9s">
  <rect x="0" y="108" width="50" height="2" fill="#e8e8e2" opacity="0.4"/>
</g>
<g class="streak" style="animation-delay:-1.8s">
  <rect x="0" y="122" width="40" height="2" fill="#e8e8e2" opacity="0.35"/>
</g>

<g id="carWrap">
  <!-- front wing -->
  <g data-part="frontwing"><rect x="14" y="122" width="38" height="4" class="carbon"/>
  <rect x="14" y="118" width="3" height="10" fill="#3a3a3a"/>
  <rect x="49" y="118" width="3" height="10" fill="#3a3a3a"/></g>

  <!-- rear wing -->
  <g data-part="rearwing"><rect x="116" y="90" width="4" height="12" fill="#333"/>
  <path d="M100,84 L134,78 L134,90 L100,92 Z" class="carbon" stroke="#e8e8e2" stroke-width="1"/>
  <rect x="131" y="72" width="4" height="20" fill="#0a0a0a" stroke="#333" stroke-width="0.6"/></g>

  <!-- body -->
  <path d="M24,128 C34,128 42,124 50,118 L69,108 C94,96 132,92 164,92
           C186,92 204,90 220,90 C236,90 252,92 264,96
           C278,100 289,109 294,118 L298,126 L298,129 L24,129 Z"
        class="body-fill" stroke="#0a0a0a" stroke-width="1"/>

  <path d="M138,92 C140,74 162,64 182,64 C202,64 215,73 219,90" class="body-fill" stroke="#0a0a0a" stroke-width="1"/>
  <g data-part="halo"><path d="M162,70 C166,56 196,56 201,71" fill="none" class="carbon" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="180" cy="77" rx="11" ry="6.5" class="dark"/></g>

  <line x1="69" y1="108" x2="264" y2="96" class="accent"/>

  <g transform="translate(100,128)" data-part="wheel">
    <g id="wheelSpin">
      <circle r="21" class="tyre"/>
      <circle r="9" class="rim"/>
      <line x1="-9" y1="0" x2="9" y2="0" stroke="#444" stroke-width="1.5"/>
      <line x1="0" y1="-9" x2="0" y2="9" stroke="#444" stroke-width="1.5"/>
    </g>
  </g>
  <g transform="translate(296,128)" data-part="wheel">
    <g id="wheelSpin2" style="animation: spin 0.22s linear infinite;">
      <circle r="21" class="tyre"/>
      <circle r="9" class="rim"/>
      <line x1="-9" y1="0" x2="9" y2="0" stroke="#444" stroke-width="1.5"/>
      <line x1="0" y1="-9" x2="0" y2="9" stroke="#444" stroke-width="1.5"/>
    </g>
  </g>
</g>

<text x="300" y="24" text-anchor="middle" font-size="11" letter-spacing="3" fill="#888880">FLAT OUT</text>
</svg>
