[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitwall"
version = "0.1.0"
description = "Stochastic F1 pit stop optimisation via MDP, GPR, and Bayesian safety car modelling"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Claudia Maria Lopez Bombin", email = "claudia@example.com" }]
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyarrow>=14.0",        # parquet I/O
    "fastf1>=3.3",          # F1 telemetry API
    "matplotlib>=3.8",      # notebooks
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "jupytext>=1.16",       # .py ↔ .ipynb conversion
    "ipykernel>=6.29",
]

[project.scripts]
pitwall-fetch = "data.fetch_data:run_pipeline"

[project.urls]
Homepage   = "https://claudialbombin.github.io/pitwall"
Repository = "https://github.com/claudialbombin/pitwall"

# ── Hatch build ──────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["core", "data"]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length    = 100
src            = ["core", "data", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N803",   # argument name should be lowercase (allows math notation: N, T, V)
    "N806",   # variable in function should be lowercase (allows: V, Q, R, P)
    "SIM108", # ternary operator (sometimes less readable for maths)
]

[tool.ruff.lint.per-file-ignores]
"tests/*"      = ["N802", "S101"]   # allow assert and CamelCase test helpers
"notebooks/*"  = ["E402", "F401"]   # allow imports anywhere and unused in notebooks

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.10"
strict                 = false          # enable gradually
warn_return_any        = true
warn_unused_ignores    = true
warn_redundant_casts   = true
disallow_untyped_defs  = true
disallow_any_generics  = false          # numpy generics are verbose
ignore_missing_imports = true           # fastf1, GPyTorch etc. lack stubs

[[tool.mypy.overrides]]
module = ["tests.*", "notebooks.*"]
disallow_untyped_defs = false           # notebooks don't need full typing

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-q",
]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests that require FastF1 and internet access",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::ImportWarning",
    "ignore::DeprecationWarning:fastf1",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source   = ["core"]
omit     = ["tests/*", "notebooks/*", "data/fetch_data.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing  = true
skip_covered  = false