# .github/workflows/ci.yml
#
# Continuous Integration pipeline for pitwall.
#
# Runs on every push and pull request to main.
# Three jobs in parallel:
#   1. lint   — ruff (style) + mypy (types)
#   2. test   — pytest with coverage, Python 3.10 and 3.11
#   3. build  — verify the package installs cleanly
#
# Failing any job blocks merging to main.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Shared environment ────────────────────────────────────────────────────────
env:
  PYTHON_DEFAULT: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:

  # ── Job 1: Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install lint dependencies
        run: pip install ruff mypy numpy scipy pandas scikit-learn

      - name: ruff — check style and imports
        run: |
          ruff check core/ tests/ data/
          ruff format --check core/ tests/ data/

      - name: mypy — type checking (core only)
        run: mypy core/ --ignore-missing-imports --no-error-summary
        continue-on-error: true   # non-blocking until we reach full coverage


  # ── Job 2: Test ──────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=core \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v \
            -m "not integration" \
            --tb=short

      - name: Upload coverage to Codecov
        if: matrix.python-version == env.PYTHON_DEFAULT
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false   # don't block CI on Codecov issues
          token: ${{ secrets.CODECOV_TOKEN }}


  # ── Job 3: Build ─────────────────────────────────────────────────────────────
  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install build tools
        run: pip install build hatchling

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist

      - name: Verify the wheel installs cleanly
        run: |
          pip install dist/*.whl
          python -c "from core.mdp import State, Compound; print('Import OK')"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7